services:
  - type: web
    name: dentsu-mini-bot
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /health
    disk:
      name: whatsapp-auth
      mountPath: /opt/render/project/src/auth_info
      sizeGB: 1
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: NEXORACLE_API_KEY
        sync: false
      - key: OMDB_API_KEY
        sync: false